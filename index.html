    <style>
        :root {
            /* 深色模式調色板 */
            --primary-color: #7983d4;       /* 主題藍色 */
            --primary-light: #9aa3ee;       /* 淺藍色 */
            --primary-dark: #5357be;        /* 深藍色 */
            --secondary-color: #6a3de0;     /* 深紫色輔助色 */
            --accent-color: #F24C3D;        /* 亮紅色強調色 */
            --purple: #C58CFF;              /* 紫色 - 保留以供參考 */
            --red: #E63946;                 /* 紅色 */
            --blue: #4A90E2;                /* 藍色 */
            --grey: #888888;                /* 灰色 */
            
            --text-light: #FFFFFF;          /* 白色文字 */
            --text-standard: rgba(255, 255, 255, 0.87); /* 標準文字顏色 */
            --text-muted: rgba(255, 255, 255, 0.6);     /* 次要文字顏色 */
            
            --bg-dark: #000000;             /* 主要背景色 - 純黑 */
            --bg-card: #1a1a1a;             /* 卡片背景色 */
            --bg-elevated: #222222;         /* 稍微提升的元素背景 */
            --bg-gradient: linear-gradient(135deg, #1A0038 0%, #32007A 50%, #6237A0 100%); /* 漸層背景 */
            
            --border-color: rgba(255, 255, 255, 0.1); /* 邊框顏色 */
            --transition: 0.6s;                       /* 轉場時間 */
            
            --border-radius-sm: 8px;
            --border-radius: 12px;
            --border-radius-lg: 24px;
            
            --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.2);
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.25);
            --shadow-lg: 0 15px 50px rgba(0, 0, 0, 0.4);
            
            --glow-primary: 0 0 15px rgba(121, 131, 212, 0.5); /* 藍色光暈 */
            --glow-secondary: 0 0 15px rgba(106, 61, 224, 0.4); /* 次要色光暈 */
            --glow-purple: 0 0 15px rgba(197, 140, 255, 0.4);   /* 紫色光暈 - 保留以供參考 */
        }
    </style>
    
<link rel="stylesheet" href="/static/css/gradients.css">
<style>
    /* 基本設定 */
    html, body, .main-container {
        background-color: #000000 !important;
    }
    
    .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 15px;
    }
    
    /* 頁面標題區 */
    .page-header {
        padding: 2rem 0;
        text-align: center;
        margin-bottom: 2rem;
    }
    
    .page-title {
        font-size: 2.5rem;
        font-weight: 700;
        color: #ffffff;
        margin-bottom: 1rem;
    }
    
    .page-subtitle {
        font-size: 1.2rem;
        color: rgba(255, 255, 255, 0.7);
        max-width: 800px;
        margin: 0 auto;
    }
    
    /* 搜尋區域 */
    .search-container {
        max-width: 500px;
        margin: 0 auto 2rem;
    }
    
    .search-input {
        width: 100%;
        padding: 0.75rem 1.5rem;
        border-radius: 2rem;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background-color: #222;
        color: white;
        font-size: 1rem;
    }
    
    .search-input:focus {
        outline: none;
        box-shadow: 0 0 0 3px rgba(197, 140, 255, 0.3);
        border-color: #C58CFF;
    }
    
    /* 篩選按鈕 */
    .filter-options {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 10px;
        margin-bottom: 2rem;
    }
    
    .filter-btn {
        background-color: #222;
        color: rgba(255, 255, 255, 0.8);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 2rem;
        padding: 0.5rem 1rem;
        cursor: pointer;
        transition: all 0.2s ease;
    }
    
    .filter-btn:hover, .filter-btn.active {
        background-color: #C58CFF;
        color: white;
    }
    
    /* 標籤樣式 */
    .member-tags {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 5px;
        margin-bottom: 10px;
    }
    
    .member-tag {
        font-size: 0.75rem;
        padding: 3px 8px;
        border-radius: 12px;
        white-space: nowrap;
        display: inline-flex;
        align-items: center;
        background-color: rgba(0,0,0,0.3);
    }
    
    .member-tag i {
        margin-right: 3px;
        font-size: 0.7rem;
    }
    
    /* 成員網格 */
    .members-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1.5rem;
        margin-bottom: 3rem;
    }
    
    /* 完全重構成員卡片結構 */
    .member-item {
        display: flex;
    }
    
    .member-card {
        width: 100%;
        background-color: transparent; /* 透明背景 */
        border-radius: 12px;
        overflow: hidden; /* 控制邊界內容 */
        border: 1px solid rgba(255, 255, 255, 0.1);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        height: 100%;
        display: flex;
        flex-direction: column;
        position: relative;
    }
    
    .member-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 10px 25px rgba(197, 140, 255, 0.15);
        border-color: #C58CFF;
    }
    
    /* 頭部容器 - 簡化 */
    .member-header {
        height: 80px;
        background-color: #1a1a1a;
    }
    
    /* 預設的頭部背景 */
    .member-header-default {
        background: linear-gradient(45deg, #1a1a1a, #333);
    }
    
    /* 頭像容器 - 重新定位 */
    .member-avatar-wrapper {
        position: absolute;
        top: 40px; /* 頭部高度一半 */
        left: 0;
        width: 100%;
        height: 80px;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        pointer-events: none; /* 防止干擾卡片點擊 */
        z-index: 5;
    }
    
    .member-avatar-container {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        border: 4px solid #1a1a1a;
        overflow: hidden;
        background-color: #333;
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
    }
    
    .member-avatar {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }
    
    /* 內容區域 */
    .member-content {
        padding: 50px 20px 20px;
        text-align: center;
        display: flex;
        flex-direction: column;
        flex: 1;
        background-color: #1a1a1a;
        position: relative;
        z-index: 1;
    }
    
    .member-name {
        font-size: 1.4rem;
        font-weight: 600;
        color: white;
        margin: 0 0 0.5rem;
    }
    
    .member-title {
        color: rgba(255, 255, 255, 0.6);
        font-size: 0.9rem;
        margin-bottom: 1rem;
    }
    
    .member-bio {
        color: rgba(255, 255, 255, 0.8);
        font-size: 0.9rem;
        margin-bottom: 1.5rem;
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }
    
    .member-footer {
        margin-top: auto;
        padding-top: 1rem;
    }
    
    .btn-view-profile {
        display: inline-block;
        background-color: #C58CFF;
        color: white !important; /* 確保文字顏色始終為白色 */
        padding: 0.6rem 1.2rem;
        border-radius: 0.5rem;
        font-weight: 500;
        text-decoration: none;
        transition: all 0.2s ease;
        border: none;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }
    
    .btn-view-profile:hover {
        background-color: #D7ADFF;
        color: #000 !important; /* 懸停時改為黑色文字增加對比度 */
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(215, 173, 255, 0.4);
    }
    
    /* 空狀態 */
    .no-members {
        text-align: center;
        padding: 3rem 0;
        grid-column: 1 / -1;
    }
    
    .no-members i {
        font-size: 3rem;
        color: rgba(255, 255, 255, 0.3);
        margin-bottom: 1rem;
    }
    
    .no-members h3 {
        font-size: 1.5rem;
        color: white;
        margin-bottom: 0.5rem;
    }
    
    .no-members p {
        color: rgba(255, 255, 255, 0.6);
    }

    /* 通知樣式 */
    .alert {
        background-color: rgba(0, 0, 0, 0.5);
        border-left: 4px solid #C58CFF;
        color: white;
        padding: 1rem;
        margin-bottom: 1rem;
        border-radius: 4px;
    }

    /* 新增: 成員留言輪播區塊樣式 */
    .testimonial-section {
        background-color: rgba(0, 0, 0, 0.3);
        border-radius: 12px;
        padding: 2rem;
        margin-bottom: 3rem;
        position: relative;
        overflow: hidden;
        border: 1px solid rgba(197, 140, 255, 0.2);
    }

    .testimonial-header {
        text-align: center;
        margin-bottom: 1.5rem;
    }

    .testimonial-title {
        font-size: 1.8rem;
        font-weight: 700;
        color: #ffffff;
        margin-bottom: 0.5rem;
    }

    .testimonial-subtitle {
        font-size: 1rem;
        color: rgba(255, 255, 255, 0.7);
    }

    .testimonial-carousel {
        position: relative;
        height: 200px;
    }

    .testimonial-item {
        position: absolute;
        width: 100%;
        height: 100%;
        opacity: 0;
        visibility: hidden;
        transition: opacity 1s ease, visibility 1s ease;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        padding: 0 2rem;
    }

    .testimonial-item.active {
        opacity: 1;
        visibility: visible;
    }

    .testimonial-quote {
        font-size: 1.2rem;
        color: white;
        font-style: italic;
        margin-bottom: 1.5rem;
        line-height: 1.6;
        position: relative;
    }

    .testimonial-quote::before,
    .testimonial-quote::after {
        content: '"';
        color: rgba(197, 140, 255, 0.5);
        font-size: 2rem;
        font-family: Georgia, serif;
    }

    .testimonial-quote::before {
        position: absolute;
        left: -20px;
        top: -10px;
    }

    .testimonial-quote::after {
        position: absolute;
        margin-left: 5px;
    }

    .testimonial-user {
        display: flex;
        align-items: center;
    }

    .testimonial-avatar {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        margin-right: 10px;
        object-fit: cover;
        border: 2px solid #C58CFF;
    }

    .testimonial-user-name {
        color: #C58CFF;
        font-weight: 600;
    }

    .testimonial-controls {
        display: flex;
        justify-content: center;
        margin-top: 1.5rem;
    }

    .testimonial-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background-color: rgba(255, 255, 255, 0.3);
        margin: 0 5px;
        cursor: pointer;
        transition: all 0.3s ease;
    }

    .testimonial-dot.active {
        background-color: #C58CFF;
        transform: scale(1.3);
    }

    /* 響應式設計 */
    @media (max-width: 1200px) {
        .members-grid {
            grid-template-columns: repeat(3, 1fr);
        }
    }
    
    @media (max-width: 992px) {
        .members-grid {
            grid-template-columns: repeat(2, 1fr);
        }
    }
    
    @media (max-width: 768px) {
        .page-title {
            font-size: 2rem;
        }
        
        .page-subtitle {
            font-size: 1rem;
        }
        
        .filter-options {
            flex-direction: row;
            overflow-x: auto;
            padding-bottom: 0.5rem;
            margin-left: -15px;
            margin-right: -15px;
            padding-left: 15px;
            padding-right: 15px;
            justify-content: flex-start;
        }

        .testimonial-quote {
            font-size: 1rem;
        }

        .testimonial-carousel {
            height: 240px; /* 手機上增加高度 */
        }
    }
    
    @media (max-width: 576px) {
        .members-grid {
            grid-template-columns: 1fr;
            gap: 1rem;
        }
        
        .member-card {
            max-width: 350px;
            margin: 0 auto;
        }
    }
</style>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body, html {
            font-family: 'Noto Sans TC', sans-serif;
            color: var(--text-standard);
            /* 移除固定背景色，改為由子模板設定 */
            line-height: 1.6;
            min-height: 100vh;
            width: 100%;
            overflow-x: hidden;
        }
        
        /* 提供默認背景，只有在沒有應用漸層時才會顯示 */
        body:not([class*='gradient-']) {
            background-color: var(--bg-dark);
        }
        
        body {
            display: flex;
            flex-direction: column;
        }
        
        /* 通知提示樣式 - 深色版 */
        .alert {
            background-color: var(--bg-elevated);
            border: 1px solid var(--border-color);
            color: var(--text-standard);
            border-radius: var(--border-radius);
            padding: 1rem;
        }
        
        .alert-success {
            border-left: 4px solid #22c55e;
        }
        
        .alert-danger {
            border-left: 4px solid #ef4444;
        }
        
        .alert-info {
            border-left: 4px solid #3b82f6;
        }
        
        .alert-warning {
            border-left: 4px solid #f59e0b;
        }
        
        .alert .btn-close {
            filter: invert(1);
        }
        
        /* 主要內容區 */
        .main-container {
            flex-grow: 1;
            padding: 0;
            width: 100%;
            position: relative;
        }
        
        /* 卡片通用樣式 - 深色版 */
        .card {
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius);
            background-color: var(--bg-card);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            transition: all 0.3s ease;
            height: 100%;
            color: var(--text-standard);
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow);
            border-color: rgba(121, 131, 212, 0.3);
        }
        
        .card-header {
            background-color: rgba(255, 255, 255, 0.03);
            border-bottom: 1px solid var(--border-color);
            padding: 20px;
            font-weight: 700;
            color: var(--text-light);
        }
        
        .card-body {
            padding: 20px;
        }
        
        /* 按鈕樣式 - 深色版 */
        .btn {
            padding: 10px 24px;
            border-radius: var(--border-radius-sm);
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            color: var (--text-light);
        }
        
        .btn-primary:hover, .btn-primary:focus {
            background-color: var (--primary-light);
            border-color: var(--primary-light);
            box-shadow: var(--glow-primary);
            transform: translateY(-2px);
        }
        
        .btn-outline-primary {
            color: var(--primary-light);
            border-color: var(--primary-color);
            background-color: transparent;
        }
        
        .btn-outline-primary:hover, .btn-outline-primary:focus {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            color: var(--text-light);
            box-shadow: var(--glow-primary);
            transform: translateY(-2px);
        }

        .btn-youtube {
            background-color: #FF0000;
            border-color: #FF0000;
            color: var(--text-light);
        }
        
        .btn-youtube:hover {
            background-color: #D90000;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
        }
        
        .btn-quiz {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }
        
        .btn-quiz:hover {
            background-color: #e3392a;
            box-shadow: 0 0 15px rgba(242, 76, 61, 0.4);
        }
        
        .btn-social {
            background-color: #C13584;
            border-color: #C13584;
        }
        
        .btn-social:hover {
            background-color: #a62e70;
            box-shadow: 0 0 15px rgba(193, 53, 132, 0.4);
        }
        
        /* 鏈接樣式 - 深色版 */
        a {
            color: var(--primary-light);
            text-decoration: none !important; /* 強制移除所有連結底線 */
            transition: all 0.2s ease;
        }
        
        a:hover, a:focus {
            color: var(--primary-light);
            text-decoration: none !重要;
            opacity: 0.9;
        }
        
        /* 頁腳 - 深色版 */
        .public-footer {
            background-color: var(--bg-card);
            color: var(--text-light);
            padding: 20px 0;
            margin-top: auto;
            box-shadow: 0 -5px 25px rgba(0, 0, 0, 0.2);
            border-top: 1px solid var(--border-color);
            position: relative;
            z-index: 10;
            text-align: center;
        }
        
        .footer-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        
        .footer-info {
            text-align: center;
            margin-bottom: 10px;
        }
        
        .social-links {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 10px;
        }
        
        .social-links a {
            color: var(--text-muted);
            font-size: 1.2rem;
            transition: all 0.3s;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: var(--bg-elevated);
        }
        
        .social-links a:hover {
            color: var(--text-light);
            background-color: var(--primary-dark);
            transform: translateY(-3px);
            box-shadow: var(--glow-primary);
        }
        
        .copyright {
            margin-top: 15px;
            color: var(--text-muted);
            font-size: 0.85rem;
        }
        
        /* 文本顏色 */
        .text-muted {
            color: var(--text-muted) !important;
        }
        
        .lead {
            color: var(--text-standard);
            font-weight: 400;
        }

        /* 頂部導航 - 簡化版 */
        .simple-header {
            background-color: rgba(26, 26, 26, 0.98);
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.15);
            padding: 15px 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .site-logo {
            display: flex;
            align-items: center;
            text-decoration: none !important; /* 防止底線出現 */
        }
        
        .site-logo img {
            height: 40px;
            width: auto;
        }
        
        .site-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-light);
            margin: 0;
        }
        
        .site-name span {
            background: linear-gradient(to right, var(--primary-light), var(--secondary-color));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .nav-links {
            display: flex;
            gap: 20px;
            align-items: center;
        }
        
        .nav-link {
            color: var(--text-standard);
            text-decoration: none;
            transition: color 0.3s;
            font-weight: 500;
            font-size: 1rem;
            position: relative;
        }
        
        .nav-link:hover {
            color: var(--text-light);
        }
        
        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--primary-light);
            transition: width 0.3s;
        }
        
        .nav-link:hover::after {
            width: 100%;
        }
        
        .mobile-menu-button {
            display: none;
            background: none;
            border: none;
            color: var(--text-light);
            font-size: 1.5rem;
            cursor: pointer;
        }
        
        @media (max-width: 768px) {
            .nav-links {
                display: none;
            }
            
            .nav-links.show {
                display: flex;
                flex-direction: column;
                position: absolute;
                top: 70px;
                left: 0;
                right: 0;
                background-color: var(--bg-card);
                padding: 20px;
                box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            }

<script>
document.addEventListener('DOMContentLoaded', function() {
    // 顯示成員總數的調試訊息
    const memberItems = document.querySelectorAll('.member-item');
    console.log('成員總數:', memberItems.length);
    
    // 確保所有成員卡片在頁面載入時都可見
    memberItems.forEach(item => {
        item.style.display = '';
    });
    
    // 搜尋功能
    const searchInput = document.getElementById('member-search');
    if (searchInput) {
        searchInput.addEventListener('input', function() {
            const searchTerm = this.value.toLowerCase().trim();
            
            memberItems.forEach(item => {
                const name = item.getAttribute('data-name').toLowerCase();
                const title = item.getAttribute('data-title').toLowerCase();
                const bio = item.getAttribute('data-bio').toLowerCase();
                const tags = (item.getAttribute('data-tags') || '').toLowerCase();
                
                if (searchTerm === '' || 
                    name.includes(searchTerm) || 
                    title.includes(searchTerm) || 
                    bio.includes(searchTerm) || 
                    tags.includes(searchTerm)) {
                    item.style.display = '';
                } else {
                    item.style.display = 'none';
                }
            });
            
            updateEmptyState();
        });
    }
    
    // 篩選按鈕功能
    const filterBtns = document.querySelectorAll('.filter-btn');
    const filterResultsContainer = document.getElementById('filter-results-container');
    
    if (filterBtns.length > 0) {
        filterBtns.forEach(btn => {
            btn.addEventListener('click', function() {
                // 更新活動按鈕狀態
                filterBtns.forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                
                const filter = this.getAttribute('data-filter');
                const tagId = this.getAttribute('data-tag-id');
                console.log('篩選條件:', filter, '標籤ID:', tagId);
                
                let matchCount = 0;
                memberItems.forEach(item => {
                    if (filter === 'all') {
                        item.style.display = '';
                        matchCount++;
                    } else if (tagId) {
                        // 使用標籤ID精確匹配
                        const tagIds = ',' + (item.getAttribute('data-tag-ids') || '') + ',';
                        if (tagIds.includes(',' + tagId + ',')) {
                            item.style.display = '';
                            matchCount++;
                        } else {
                            item.style.display = 'none';
                        }
                    } else {
                        const title = item.getAttribute('data-title').toLowerCase();
                        const bio = item.getAttribute('data-bio').toLowerCase();
                        const tags = ',' + (item.getAttribute('data-tags') || '') + ',';
                        
                        if (tags.includes(',' + filter + ',')) {
                            item.style.display = '';
                            matchCount++;
                        } else {
                            item.style.display = 'none';
                        }
                    }
                });
                
                // 更新篩選結果提示
                updateFilterResults(filter, matchCount, this.textContent.trim());
                updateEmptyState();
            });
        });
    }
    
    // 更新篩選結果提示
    function updateFilterResults(filter, count, displayName) {
        // 清空目前的提示
        filterResultsContainer.innerHTML = '';
        
        // 如果是"全部"篩選，或者有符合條件的項目，就不顯示提示
        if (filter === 'all' || count > 0) return;
        
        // 添加提示訊息
        const alert = document.createElement('div');
        alert.className = 'alert';
        alert.innerHTML = `
            <i class="fas fa-info-circle me-2"></i>
            找不到符合「${displayName}」標籤的成員。
        `;
        
        filterResultsContainer.appendChild(alert);
    }
    
    // 更新空狀態
    function updateEmptyState() {
        const membersGrid = document.getElementById('members-grid');
        let visibleItems = 0;
        
        memberItems.forEach(item => {
            if (item.style.display !== 'none') {
                visibleItems++;
            }
        });
        
        // 如果沒有可見項目，顯示沒有結果的提示
        if (visibleItems === 0 && memberItems.length > 0) {
            // 檢查是否已有空狀態提示
            let noResults = document.querySelector('.no-results');
            if (!noResults) {
                noResults = document.createElement('div');
                noResults.className = 'no-members no-results';
                noResults.innerHTML = `
                    <i class="fas fa-search"></i>
                    <h3>找不到符合條件的成員</h3>
                    <p>請嘗試使用不同的搜尋詞或篩選條件</p>
                `;
                
                membersGrid.appendChild(noResults);
            }
        } else {
            // 移除任何存在的空狀態提示
            const noResults = document.querySelector('.no-results');
            if (noResults) {
                noResults.remove();
            }
        }
    }

    // 新增: 成員留言輪播功能
    const testimonialCarousel = document.getElementById('testimonialCarousel');
    if (testimonialCarousel) {
        const testimonialItems = testimonialCarousel.querySelectorAll('.testimonial-item');
        const testimonialDots = document.querySelectorAll('.testimonial-dot');
        let currentIndex = 0;
        let intervalId = null;

        // 顯示指定索引的留言
        function showTestimonial(index) {
            testimonialItems.forEach(item => {
                item.classList.remove('active');
            });
            testimonialDots.forEach(dot => {
                dot.classList.remove('active');
            });

            testimonialItems[index].classList.add('active');
            testimonialDots[index].classList.add('active');
            currentIndex = index;
        }

        // 顯示下一個留言
        function showNextTestimonial() {
            const nextIndex = (currentIndex + 1) % testimonialItems.length;
            showTestimonial(nextIndex);
        }

        // 綁定點擊事件到控制點
        testimonialDots.forEach(dot => {
            dot.addEventListener('click', function() {
                const index = parseInt(this.getAttribute('data-index'));
                showTestimonial(index);
                resetCarouselTimer(); // 重設計時器
            });
        });

        // 設置自動輪播
        function startCarousel() {
            intervalId = setInterval(showNextTestimonial, 6000); // 每6秒切換一次
        }

        function resetCarouselTimer() {
            if (intervalId) {
                clearInterval(intervalId);
            }
            startCarousel();
        }

        // 啟動自動輪播
        if (testimonialItems.length > 0) {
            startCarousel();
        }
    }
});
</script>
